openapi: 3.1.0
info:
  title: VibeSolver API
  version: 0.1.0
paths:
  /api/v1/sources:
    get:
      tags:
      - sources
      summary: List Sources
      operationId: list_sources_api_v1_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SourceOut'
                type: array
                title: Response List Sources Api V1 Sources Get
    post:
      tags:
      - sources
      summary: Create Source
      operationId: create_source_api_v1_sources_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/{source_id}:
    get:
      tags:
      - sources
      summary: Get Source
      operationId: get_source_api_v1_sources__source_id__get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - sources
      summary: Update Source
      operationId: update_source_api_v1_sources__source_id__patch
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sources
      summary: Delete Source
      operationId: delete_source_api_v1_sources__source_id__delete
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/{source_id}/stats:
    get:
      tags:
      - sources
      summary: Get Source Stats
      operationId: get_source_stats_api_v1_sources__source_id__stats_get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceStatsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/{source_id}/resources/{category}/{resource_id}:
    get:
      tags:
      - sources
      summary: Get Markdown Resource
      operationId: get_markdown_resource_api_v1_sources__source_id__resources__category___resource_id__get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      - name: category
        in: path
        required: true
        schema:
          type: string
          title: Category
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceContentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - sources
      summary: Update Markdown Resource
      operationId: update_markdown_resource_api_v1_sources__source_id__resources__category___resource_id__patch
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      - name: category
        in: path
        required: true
        schema:
          type: string
          title: Category
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceContentUpdate'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sources
      summary: Delete Project Resource
      operationId: delete_project_resource_api_v1_sources__source_id__resources__category___resource_id__delete
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      - name: category
        in: path
        required: true
        schema:
          type: string
          title: Category
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/{source_id}/import:
    post:
      tags:
      - sources
      summary: Enqueue Import
      operationId: enqueue_import_api_v1_sources__source_id__import_post
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportEnqueueOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - sources
      summary: Get Import Status
      operationId: get_import_status_api_v1_sources__source_id__import_get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connectors:
    get:
      tags:
      - connectors
      summary: List Connectors
      operationId: list_connectors_api_v1_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConnectorInfo'
                type: array
                title: Response List Connectors Api V1 Connectors Get
  /api/v1/uploads:
    post:
      tags:
      - uploads
      summary: Upload Archive
      operationId: upload_archive_api_v1_uploads_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_archive_api_v1_uploads_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/uploads/markdown:
    post:
      tags:
      - uploads
      summary: Upload Markdown
      operationId: upload_markdown_api_v1_uploads_markdown_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_markdown_api_v1_uploads_markdown_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/catalog:
    get:
      tags:
      - models
      summary: Provider Catalog
      operationId: provider_catalog_api_v1_models_providers_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelProviderTypeOut'
                type: array
                title: Response Provider Catalog Api V1 Models Providers Catalog Get
  /api/v1/models/providers:
    get:
      tags:
      - models
      summary: List Providers
      operationId: list_providers_api_v1_models_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelProviderOut'
                type: array
                title: Response List Providers Api V1 Models Providers Get
    post:
      tags:
      - models
      summary: Create Provider
      operationId: create_provider_api_v1_models_providers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProviderOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/test:
    post:
      tags:
      - models
      summary: Test Provider
      operationId: test_provider_api_v1_models_providers_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                type: object
                title: Response Test Provider Api V1 Models Providers Test Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/{connection_id}/test:
    post:
      tags:
      - models
      summary: Test Saved Provider
      operationId: test_saved_provider_api_v1_models_providers__connection_id__test_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                title: Response Test Saved Provider Api V1 Models Providers  Connection Id  Test Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/{connection_id}:
    patch:
      tags:
      - models
      summary: Update Provider
      operationId: update_provider_api_v1_models_providers__connection_id__patch
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProviderOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - models
      summary: Delete Provider
      operationId: delete_provider_api_v1_models_providers__connection_id__delete
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/{connection_id}/available:
    get:
      tags:
      - models
      summary: Available Models
      operationId: available_models_api_v1_models_providers__connection_id__available_get
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      - name: capability
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Capability
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderAvailableModelOut'
                title: Response Available Models Api V1 Models Providers  Connection Id  Available Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/{connection_id}/sync:
    post:
      tags:
      - models
      summary: Sync Models
      operationId: sync_models_api_v1_models_providers__connection_id__sync_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelOut'
                title: Response Sync Models Api V1 Models Providers  Connection Id  Sync Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/{connection_id}/models:
    post:
      tags:
      - models
      summary: Add Model
      operationId: add_model_api_v1_models_providers__connection_id__models_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderModelAdd'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/providers/{connection_id}/models/pull:
    post:
      tags:
      - models
      summary: Pull Ollama Model
      operationId: pull_ollama_model_api_v1_models_providers__connection_id__models_pull_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OllamaPullIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models:
    get:
      tags:
      - models
      summary: List Models
      operationId: list_models_api_v1_models_get
      parameters:
      - name: capability
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Capability
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelOut'
                title: Response List Models Api V1 Models Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/{model_id}:
    delete:
      tags:
      - models
      summary: Delete Model
      operationId: delete_model_api_v1_models__model_id__delete
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: integer
          title: Model Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/projects/{source_id}/selections:
    get:
      tags:
      - models
      summary: Get Project Model Selections
      operationId: get_project_model_selections_api_v1_models_projects__source_id__selections_get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSelectionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/projects/{source_id}/selections/{role}:
    put:
      tags:
      - models
      summary: Set Project Model Selection
      operationId: set_project_model_selection_api_v1_models_projects__source_id__selections__role__put
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      - name: role
        in: path
        required: true
        schema:
          type: string
          title: Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSelectionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSelectionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    Body_upload_archive_api_v1_uploads_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_archive_api_v1_uploads_post
    Body_upload_markdown_api_v1_uploads_markdown_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_markdown_api_v1_uploads_markdown_post
    ConfigField:
      properties:
        name:
          type: string
          title: Name
        label:
          type: string
          title: Label
        kind:
          type: string
          enum:
          - text
          - path
          - password
          - folder
          - file
          title: Kind
        required:
          type: boolean
          title: Required
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
        placeholder:
          anyOf:
          - type: string
          - type: 'null'
          title: Placeholder
      type: object
      required:
      - name
      - label
      - kind
      - required
      title: ConfigField
    ConfigSchema:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/ConfigField'
          type: array
          title: Fields
      type: object
      required:
      - fields
      title: ConfigSchema
    ConnectorInfo:
      properties:
        type:
          type: string
          title: Type
        ready:
          type: boolean
          title: Ready
        config_schema:
          $ref: '#/components/schemas/ConfigSchema'
      type: object
      required:
      - type
      - ready
      - config_schema
      title: ConnectorInfo
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportEnqueueOut:
      properties:
        task_id:
          type: string
          title: Task Id
      type: object
      required:
      - task_id
      title: ImportEnqueueOut
    ImportStatusOut:
      properties:
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - status
      - progress
      - error
      title: ImportStatusOut
    LastImportOut:
      properties:
        status:
          type: string
          title: Status
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
      type: object
      required:
      - status
      - finished_at
      title: LastImportOut
    ModelOut:
      properties:
        id:
          type: integer
          title: Id
        provider_connection_id:
          type: integer
          title: Provider Connection Id
        provider_type:
          type: string
          title: Provider Type
        provider_name:
          type: string
          title: Provider Name
        provider_model_id:
          type: string
          title: Provider Model Id
        display_name:
          type: string
          title: Display Name
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        status:
          type: string
          title: Status
        progress:
          anyOf:
          - type: integer
          - type: 'null'
          title: Progress
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - id
      - provider_connection_id
      - provider_type
      - provider_name
      - provider_model_id
      - display_name
      - capabilities
      - status
      - progress
      - metadata
      title: ModelOut
    ModelProviderCreate:
      properties:
        provider_type:
          type: string
          title: Provider Type
        name:
          type: string
          title: Name
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
      type: object
      required:
      - provider_type
      - name
      title: ModelProviderCreate
    ModelProviderOut:
      properties:
        id:
          type: integer
          title: Id
        provider_type:
          type: string
          title: Provider Type
        name:
          type: string
          title: Name
        base_url:
          type: string
          title: Base Url
        has_api_key:
          type: boolean
          title: Has Api Key
      type: object
      required:
      - id
      - provider_type
      - name
      - base_url
      - has_api_key
      title: ModelProviderOut
    ModelProviderTypeOut:
      properties:
        provider_type:
          type: string
          title: Provider Type
        display_name:
          type: string
          title: Display Name
        default_url:
          type: string
          title: Default Url
        requires_api_key:
          type: boolean
          title: Requires Api Key
        fixed_url:
          type: boolean
          title: Fixed Url
        sync_all_models:
          type: boolean
          title: Sync All Models
        supports_model_pull:
          type: boolean
          title: Supports Model Pull
      type: object
      required:
      - provider_type
      - display_name
      - default_url
      - requires_api_key
      - fixed_url
      - sync_all_models
      - supports_model_pull
      title: ModelProviderTypeOut
    ModelProviderUpdate:
      properties:
