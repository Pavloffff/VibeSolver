[project]
name = "vibesolver"
version = "0.1.0"
description = "VibeSolver backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "celery[redis]==5.6.3",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "greenlet==3.2.4",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "boto3==1.43.123",
    "dulwich==1.2.20",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "boto3-stubs[s3]==1.43.123",
    "openapi-spec-validator==0.7.2",
    "pyyaml==6.0.3",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "dulwich",
    "dulwich.*",
    "celery",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
